# APK distribution host (apk.bpconnect.app -> loopback :8081 via the crm tunnel).
# Everything here is an update artifact — never let Cloudflare or the device
# cache a stale manifest/APK (the schedule project got bitten by exactly this;
# clients additionally cache-bust with ?t=).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;

    types {
        application/vnd.android.package-archive apk;
        application/json json;
        text/html html;
    }

    add_header Cache-Control "no-store" always;
}
