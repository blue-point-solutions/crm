# Web app host (app.bpconnect.app -> loopback :8083 via the crm tunnel).
# Serves the Expo static web export (SPA output) from web-dist/, published by
# scripts/release-web.sh. Client-side routing: unknown paths fall back to
# index.html. Bundles under /_expo/static/ are content-hashed -> immutable;
# the HTML shell itself is never cached so a new release lands on next load.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
